# =============================================================================
# PRACTICAL USE CASE: E-Commerce Application Infrastructure
# =============================================================================
# Scenario: Deploy an e-commerce platform with:
#   - Web servers (Nginx) for frontend
#   - Application servers (Node.js/Python) for backend API
#   - Database servers (PostgreSQL) for data storage
#   - Redis servers for caching/sessions
#   - Monitoring stack (Prometheus + Grafana)
#
# Environments: Development, Staging, Production
# =============================================================================

[all:vars]
# SSH Connection - common for all hosts
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/ecommerce_deploy_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# Privilege Escalation - needed to install packages, manage services
ansible_become=yes
ansible_become_method=sudo

# Application-wide settings
app_name=ecommerce
app_domain=myshop.com
admin_email=devops@myshop.com

# =============================================================================
# DEVELOPMENT ENVIRONMENT
# Single server setup - all services on one machine (cost-effective for dev)
# =============================================================================
[dev]
dev-server ansible_host=10.0.1.10

[dev:vars]
environment=development
debug_mode=true
log_level=debug
ssl_enabled=false
# Dev runs everything on one server
nginx_port=80
api_port=3000
db_port=5432
redis_port=6379

# =============================================================================
# STAGING ENVIRONMENT  
# Mirrors production but smaller scale - for QA testing
# =============================================================================
[staging_web]
stg-web1 ansible_host=10.0.2.10

[staging_app]
stg-app1 ansible_host=10.0.2.20

[staging_db]
stg-db1 ansible_host=10.0.2.30

[staging:children]
staging_web
staging_app
staging_db

[staging:vars]
environment=staging
debug_mode=false
log_level=info
ssl_enabled=true
ssl_cert_path=/etc/ssl/certs/staging.myshop.com.crt
backup_enabled=true
backup_retention_days=7

# =============================================================================
# PRODUCTION ENVIRONMENT
# High availability setup with load balancing and replication
# =============================================================================

# --- Load Balancers (HAProxy) ---
[prod_loadbalancers]
prod-lb1 ansible_host=10.0.3.5 keepalived_priority=101 keepalived_state=MASTER
prod-lb2 ansible_host=10.0.3.6 keepalived_priority=100 keepalived_state=BACKUP

[prod_loadbalancers:vars]
haproxy_stats_enabled=true
haproxy_stats_port=8404
virtual_ip=10.0.3.100

# --- Web Servers (Nginx - serve static files, reverse proxy) ---
[prod_web]
prod-web1 ansible_host=10.0.3.10 nginx_worker_connections=4096
prod-web2 ansible_host=10.0.3.11 nginx_worker_connections=4096
prod-web3 ansible_host=10.0.3.12 nginx_worker_connections=4096

[prod_web:vars]
nginx_worker_processes=auto
gzip_enabled=true
client_max_body_size=50M
# Upstream app servers for reverse proxy
upstream_servers=10.0.3.20:3000,10.0.3.21:3000,10.0.3.22:3000

# --- Application Servers (Node.js/Python API) ---
[prod_app]
prod-app1 ansible_host=10.0.3.20 app_instance_id=1
prod-app2 ansible_host=10.0.3.21 app_instance_id=2
prod-app3 ansible_host=10.0.3.22 app_instance_id=3

[prod_app:vars]
node_env=production
api_port=3000
api_workers=4
rate_limit_enabled=true
rate_limit_max=100
# Database connection
db_host=10.0.3.30
db_name=ecommerce_prod
db_pool_size=20
# Redis connection
redis_host=10.0.3.40
session_ttl=3600

# --- Database Servers (PostgreSQL with replication) ---
[prod_db_primary]
prod-db1 ansible_host=10.0.3.30 postgresql_role=primary

[prod_db_replica]
prod-db2 ansible_host=10.0.3.31 postgresql_role=replica replication_source=10.0.3.30
prod-db3 ansible_host=10.0.3.32 postgresql_role=replica replication_source=10.0.3.30

[prod_db:children]
prod_db_primary
prod_db_replica

[prod_db:vars]
postgresql_version=15
postgresql_port=5432
postgresql_max_connections=200
postgresql_shared_buffers=4GB
backup_enabled=true
backup_schedule="0 2 * * *"
backup_retention_days=30

# --- Cache Servers (Redis Cluster) ---
[prod_cache]
prod-redis1 ansible_host=10.0.3.40 redis_role=master
prod-redis2 ansible_host=10.0.3.41 redis_role=replica redis_master=10.0.3.40
prod-redis3 ansible_host=10.0.3.42 redis_role=replica redis_master=10.0.3.40

[prod_cache:vars]
redis_port=6379
redis_maxmemory=2gb
redis_maxmemory_policy=allkeys-lru
redis_password="{{ vault_redis_password }}"

# --- Production Parent Group ---
[production:children]
prod_loadbalancers
prod_web
prod_app
prod_db
prod_cache

[production:vars]
environment=production
debug_mode=false
log_level=warn
ssl_enabled=true
ssl_cert_path=/etc/ssl/certs/myshop.com.crt
monitoring_enabled=true
alerting_enabled=true

# =============================================================================
# MONITORING STACK (Shared across environments)
# =============================================================================
[monitoring]
prometheus ansible_host=10.0.4.10 prometheus_retention=30d
grafana ansible_host=10.0.4.11 grafana_admin_user=admin
alertmanager ansible_host=10.0.4.12

[monitoring:vars]
prometheus_scrape_interval=15s
grafana_port=3000
alertmanager_slack_webhook="{{ vault_slack_webhook }}"

# =============================================================================
# UTILITY GROUPS - For targeted playbook runs
# =============================================================================

# All web servers across environments (for nginx updates)
[all_web:children]
staging_web
prod_web

# All app servers across environments (for code deployments)
[all_app:children]
staging_app
prod_app

# All database servers (for maintenance tasks)
[all_db:children]
staging_db
prod_db

# All cache servers
[all_cache:children]
prod_cache

# =============================================================================
# EXAMPLE PLAYBOOK COMMANDS:
# =============================================================================
# Deploy to staging:     ansible-playbook -i inventory_practical.ini deploy.yml -l staging
# Deploy to production:  ansible-playbook -i inventory_practical.ini deploy.yml -l production
# Update only web tier:  ansible-playbook -i inventory_practical.ini nginx.yml -l all_web
# Database maintenance:  ansible-playbook -i inventory_practical.ini db_backup.yml -l all_db
# Scale app servers:     ansible-playbook -i inventory_practical.ini deploy.yml -l prod_app
# =============================================================================
