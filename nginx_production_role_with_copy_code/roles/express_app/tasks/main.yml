---
- name: Install Node.js via snap
  snap:
    name: node
    classic: yes
    channel: "{{ express_node_version }}/stable"
  when: ansible_os_family == 'Debian'

- name: Create app directory
  file:
    path: "{{ express_app_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Copy Express app code
  copy:
    src: "{{ express_app_src }}"
    dest: "{{ express_app_dir }}"
  when: express_app_src is defined

- name: Install dependencies
  shell: export PATH=/snap/bin:$PATH && cd {{ express_app_dir }} && npm install
  become: yes

- name: Start Express app
  shell: export PATH=/snap/bin:$PATH && cd {{ express_app_dir }} && nohup {{ express_start_command }} &
  async: 3600
  poll: 0
  become: yes

