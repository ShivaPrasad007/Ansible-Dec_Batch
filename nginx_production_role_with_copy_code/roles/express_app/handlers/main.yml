---
- name: Restart Express app
  shell: export PATH=/snap/bin:$PATH && pkill -f '{{ express_start_command }}'
  ignore_errors: yes
  become: yes

- name: Start Express app
  shell: export PATH=/snap/bin:$PATH && cd {{ express_app_dir }} && nohup {{ express_start_command }} &
  async: 3600
  poll: 0
  become: yes