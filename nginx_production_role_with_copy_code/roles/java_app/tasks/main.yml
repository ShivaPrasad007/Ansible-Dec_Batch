---
- name: Update apt cache
  apt:
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Install Java
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Install Maven
  apt:
    name: maven
    state: present
  when: ansible_os_family == 'Debian' and java_build_tool == 'maven'

- name: Install Gradle
  apt:
    name: gradle
    state: present
  when: ansible_os_family == 'Debian' and java_build_tool == 'gradle'

- name: Create app directory
  file:
    path: "{{ java_app_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Copy Java app code
  copy:
    src: "{{ java_app_src }}"
    dest: "{{ java_app_dir }}"
  when: java_app_src is defined

- name: Build Java app with Maven
  shell: cd {{ java_app_dir }} && mvn clean package
  become: yes
  when: java_build_tool == 'maven'

- name: Build Java app with Gradle
  shell: cd {{ java_app_dir }} && gradle build
  become: yes
  when: java_build_tool == 'gradle'

- name: Start Java app
  shell: cd {{ java_app_dir }} && nohup {{ java_start_command }} </dev/null >/dev/null 2>&1 &
  become: yes

